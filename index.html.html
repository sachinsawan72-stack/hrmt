<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeamDesk HR</title>
<style>
:root{--ink:#16231f;--side:#12302c;--acc:#0f766e;--acc2:#e9f4f2;--bg:#f4f6f5;--card:#fff;--line:#dce3e1;--mut:#62736e;--red:#b42318;--amb:#b45309}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
body.dark{--ink:#e6eeec;--bg:#0e1816;--card:#16231f;--line:#2a3b37;--mut:#94a8a3;--acc2:#1c3a36}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:360px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);color:#cfe3df;overflow:auto;padding:14px 8px;transition:.2s;z-index:5}
aside h1{font-size:16px;margin:4px 10px 14px;color:#fff}
aside a{display:block;padding:9px 12px;border-radius:6px;color:#cfe3df;cursor:pointer;text-decoration:none}
aside a:hover{background:#1c4540}aside a.on{background:var(--acc);color:#fff}
main{margin-left:220px;padding:18px 20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.top h2{margin:0;font-size:20px}#burger{display:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.f label{display:block;font-size:12px;color:var(--mut)}.f input,.f select,.f textarea{width:100%;color:var(--ink)}
.btn{background:var(--acc);color:#fff;border:0;padding:7px 12px;border-radius:6px;cursor:pointer}.btn.g{background:var(--acc2);color:var(--acc)}.btn.r{background:#fde8e6;color:var(--red)}.btn.s{padding:3px 8px;font-size:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--acc2);font-weight:600}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--acc2);color:var(--acc)}.tag.Pending{background:#fef3c7;color:var(--amb)}.tag.Rejected,.tag.Left{background:#fde8e6;color:var(--red)}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;overflow:auto;padding:20px}#modal>div{background:var(--card);border-radius:10px;padding:18px;max-width:760px;margin:auto}
#toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;display:none;z-index:30}
.letter{color:#16231f;background:#fff;padding:30px;border:1px solid var(--line);max-width:760px;line-height:1.7}
.idc{color:#16231f;width:250px;border:2px solid var(--acc);border-radius:10px;overflow:hidden;background:#fff;text-align:center;font-size:12px;display:inline-block;margin:6px}
.idc .h{background:var(--acc);color:#fff;padding:8px;font-weight:700}.idc img,.idc .ph{width:90px;height:100px;object-fit:cover;margin:10px auto 4px;display:block;background:#e5ebe9;border-radius:4px}
#print{display:none}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:12px}#burger{display:inline-block}}
@media print{body.dark{--ink:#16231f;--line:#dce3e1;--card:#fff;--acc2:#e9f4f2;--mut:#62736e}body{background:#fff!important}body>*:not(#print){display:none!important}#print{display:block!important}.nop{display:none}.letter{border:0}}
</style></head><body>
<div id="login"><div class="box"><h2 style="margin-top:0">TeamDesk HR Login</h2>
<p id="hint" style="color:var(--mut)">Demo mode: admin / admin123 (connect Firebase for real login)</p>
<input id="lu" placeholder="Email / Username" style="width:100%;margin-bottom:8px"><input id="lp" type="password" placeholder="Password" style="width:100%;margin-bottom:12px">
<button class="btn" style="width:100%" onclick="login()">Sign in</button><p><a href="#" onclick="fpw();return false">Forgot password?</a></p></div></div>
<div id="app"><aside id="side"><h1>TeamDesk HR</h1><div id="nav"></div><a onclick="logout()">Sign out</a></aside>
<main><div class="top"><div><button class="btn g" id="burger" onclick="$('#side').classList.toggle('open')">Menu</button> <h2 id="title" style="display:inline"></h2></div><span id="who" style="color:var(--mut)"></span></div><div id="main"></div></main></div>
<div id="modal"><div id="mbody"></div></div><div id="toast"></div><div id="print"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),ym=()=>today().slice(0,7);
const CO={name:'Your Company Pvt. Ltd.',addr:'Company Address, City, State - 000000',sign:'Authorized Signatory (HR)',logo:'',sigimg:''};
const RU={basic:50,hra:20,pf:12,esic:0.75,esicLim:21000,pt:200,ptLim:15000,leave:12};
const DOCS=['Aadhaar Card','PAN Card','Bank Passbook','Photograph','Resume','Education Certificates','Police Verification','Medical Certificate','Appointment Letter'];
const FD=[['name','Employee Name'],['eid','Employee ID'],['father',"Father's Name"],['dob','Date of Birth','date'],['gender','Gender','sel:Male,Female,Other'],['mobile','Mobile Number'],['email','Email ID','email'],['caddr','Current Address','ta'],['paddr','Permanent Address','ta'],['emg','Emergency Contact'],['desig','Designation'],['dept','Department'],['loc','Location / Site'],['doj','Joining Date','date'],['prob','Probation End Date','date'],['salary','Gross Salary (monthly Rs)','number'],['bank','Bank Details (A/c, IFSC)'],['uan','UAN'],['esic','ESIC Number'],['pan','PAN Number'],['aadhaar','Aadhaar Number'],['blood','Blood Group']];
const NAV=['Dashboard','New Employee','Active Employees','Left Employees','Attendance','Leave Management','Salary & Payroll','Documents','ID Card Generator','HR Letters','Reports','Backup & Restore','Settings'];
let db,user,page='Dashboard',editId=null,tmpPhoto='';
function load(){try{db=JSON.parse(localStorage.getItem('hrdb'))}catch(e){}
 if(!db)db={emps:[],att:{},leaves:[],log:[],admins:[{u:'admin',p:'admin123',role:'Admin'}]};}
function save(){if(user&&user.role==='Viewer'){toast('Viewer role: read-only');return false}if(FBON()){FB.push(db).catch(e=>toast('Cloud save failed: '+(e.code||e.message)));return true}
 try{localStorage.setItem('hrdb',JSON.stringify(db));
 const d=today();if(localStorage.getItem('hrbk_d')!==d){localStorage.setItem('hrbk',JSON.stringify(db));localStorage.setItem('hrbk_d',d)}}catch(e){toast('Storage full! Take a backup.')}return true}
function log(t){db.log.unshift({t:new Date().toLocaleString(),u:user?user.u:'-',a:t});db.log=db.log.slice(0,300)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
let fails=0,locked=0;const FBON=()=>window.FB&&FB.on;
async function login(){if(Date.now()<locked)return toast('Too many attempts. Try again in 1 minute');let a;
 try{if(FBON()){a=await FB.login($('#lu').value.trim(),$('#lp').value,async()=>prompt('Enter the 6-digit code from your Authenticator app'));db=await FB.load();if(db.co)Object.assign(CO,db.co);if(db.rules)Object.assign(RU,db.rules)}
 else{a=db.admins.find(x=>x.u===$('#lu').value&&x.p===$('#lp').value);if(!a)throw{message:'Wrong username or password'}}}
 catch(e){if(++fails>=5){locked=Date.now()+60000;fails=0}return toast(e.message||e.code||'Login failed')}
 user=a;$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent=a.u+' ('+a.role+')';log('Logged in');save();go('Dashboard')}
async function fpw(){const m=$('#lu').value.trim();if(!FBON()||!m)return toast('Enter your email first (Firebase mode)');try{await FB.reset(m);toast('Password reset email sent')}catch(e){toast(e.code)}}
const me=()=>user.uid||user.u,adm=()=>user.role==='Admin',can=o=>adm()||(user.role==='HR'&&!!o&&o.by===me());
function ck(o){if(can(o))return true;toast(user.role==='Viewer'?'Viewer role: read-only':'You can only change records you created');return false}
const ro=()=>user.role==='Viewer'&&(toast('Viewer role: read-only'),true);
function logout(){if(FBON()){FB.out().then(()=>location.reload());return}user=null;$('#app').style.display='none';$('#login').style.display='grid';$('#lp').value=''}
function go(p){page=p;$('#side').classList.remove('open');$('#title').textContent=p;
 $('#nav').innerHTML=NAV.map(n=>`<a class="${n==p?'on':''}" onclick="go('${n}')">${n}</a>`).join('');
 ({'Dashboard':dash,'New Employee':newEmp,'Active Employees':active,'Left Employees':left,'Attendance':attend,'Leave Management':leave,'Salary & Payroll':payroll,'Documents':docs,'ID Card Generator':idcards,'HR Letters':letters,'Reports':reports,'Backup & Restore':backup,'Settings':settings})[p]()}
const act=()=>db.emps.filter(e=>e.status!=='Left'),lft=()=>db.emps.filter(e=>e.status==='Left');
const M=h=>$('#main').innerHTML=h;
function modal(h){$('#mbody').innerHTML=h+'<p><button class="btn g" onclick="$(\'#modal\').style.display=\'none\'">Close</button></p>';$('#modal').style.display='block'}
function pr(h){$('#print').innerHTML=h;window.print()}
function csv(name,rows){const t=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name+'.csv';a.click();toast('Downloaded '+name+'.csv (opens in Excel)')}
function tbl(h,rows){return `<div class="tw"><table><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')||'<tr><td colspan='+h.length+'>No records found</td></tr>'}</table></div>`}
const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const eopts=l=>l.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.eid)})</option>`).join('');
const E=id=>db.emps.find(e=>e.id===id);
function dash(){const a=act(),m=ym(),t=db.att[today()]||{},md=s=>(s||'').slice(5,10),td=today().slice(5,10);
 const nj=db.emps.filter(e=>(e.doj||'').slice(0,7)==m).length,lm=lft().filter(e=>(e.lwd||'').slice(0,7)==m).length;
 const pres=Object.values(t).filter(x=>x.s==='Present'||x.s==='Half Day').length;
 const pend=a.reduce((n,e)=>n+DOCS.filter(d=>(e.docs||{})[d]!=='Verified').length,0);
 const bd=a.filter(e=>e.dob&&md(e.dob)>=td).sort((x,y)=>md(x.dob)<md(y.dob)?-1:1).slice(0,5),an=a.filter(e=>e.doj&&md(e.doj)>=td&&e.doj.slice(0,4)<today().slice(0,4)).slice(0,5);
 const S=[['Total Employees',db.emps.length],['Active Employees',a.length],['New Joinings (month)',nj],['Left Employees',lft().length],["Today's Attendance",pres+' / '+a.length],['Pending Documents',pend]];
 let mo=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);mo.push([k,db.emps.filter(e=>(e.doj||'').slice(0,7)==k).length,lft().filter(e=>(e.lwd||'').slice(0,7)==k).length])}
 M(`<div class="grid">${S.map(s=>`<div class="card stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div><br>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><b>Upcoming birthdays</b><br>${bd.map(e=>esc(e.name)+' - '+e.dob.slice(5)).join('<br>')||'None'}</div>
 <div class="card"><b>Probation ending in 30 days</b><br>${a.filter(e=>e.prob&&e.prob<=new Date(Date.now()+30*864e5).toISOString().slice(0,10)).map(e=>esc(e.name)+' - '+e.prob).join('<br>')||'None'}</div>
 <div class="card"><b>Upcoming work anniversaries</b><br>${an.map(e=>esc(e.name)+' - '+e.doj.slice(5)).join('<br>')||'None'}</div></div><br>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><b>Department-wise headcount</b>${bars(Object.entries(a.reduce((o,e)=>(o[e.dept||'-']=(o[e.dept||'-']||0)+1,o),{})),'var(--acc)')}</div><div class="card"><b>Joined per month</b>${bars(mo.map(x=>[x[0],x[1]]),'var(--acc)')}<br><b>Left per month</b>${bars(mo.map(x=>[x[0],x[2]]),'var(--red)')}</div></div><p>Attrition (last 12 months): <b>${db.emps.length?Math.round(lft().filter(e=>(e.lwd||'')>new Date(Date.now()-365*864e5).toISOString().slice(0,10)).length/db.emps.length*100):0}%</b></p>`)}
function newEmp(){const e=editId?E(editId):{};tmpPhoto=e.photo||'';
 M(`<div class="card"><h3 style="margin-top:0">${editId?'Edit employee':'Register new employee'}</h3><div class="f">${FD.map(([k,l,t])=>`<div><label>${l}</label>${t=='ta'?`<textarea id="f_${k}" rows="2">${esc(e[k])}</textarea>`:t&&t.startsWith('sel')?sel('f_'+k,t.slice(4).split(','),e[k]):`<input id="f_${k}" type="${t||'text'}" value="${esc(e[k])}">`}</div>`).join('')}
 <div><label>Employee Photograph</label><input type="file" accept="image/*" onchange="photo(this)"></div></div><br>
 <button class="btn" onclick="saveEmp()">Save employee</button> <button class="btn g" onclick="editId=null;go('Active Employees')">Cancel</button></div>`)}
function photo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=150;c.height=170;c.getContext('2d').drawImage(im,0,0,150,170);tmpPhoto=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function saveEmp(){if(ro())return;const o={};FD.forEach(([k])=>o[k]=$('#f_'+k).value.trim());
 if(!o.name||!o.eid)return toast('Name and Employee ID are required');
 if(db.emps.some(x=>x.eid===o.eid&&x.id!==editId))return toast('Employee ID already exists');
 o.photo=tmpPhoto;
 if(editId){const e=E(editId);if(!ck(e))return;e.hist=e.hist||[];['dept','desig','loc','salary'].forEach(k=>{if(String(e[k])!==String(o[k]))e.hist.push({d:today(),c:k+': '+(e[k]||'-')+' -> '+o[k]})});const ch=FD.filter(([k])=>String(e[k]||'')!==String(o[k]||'')).map(([k])=>k+': '+(e[k]||'-')+' -> '+o[k]).join('; ');Object.assign(e,o);log('Edited '+o.name+(ch?' ['+ch+']':''))}
 else{o.id='e'+Date.now();o.status='Active';o.by=me();o.byn=user.u;o.docs={};o.hist=[{d:o.doj||today(),c:'Joined at salary '+o.salary}];db.emps.push(o);log('Added '+o.name)}
 if(save()){editId=null;toast('Saved');go('Active Employees')}}
let fq='',fd='',fl='';
function active(){const a=act(),dp=[...new Set(a.map(e=>e.dept).filter(Boolean))],lc=[...new Set(a.map(e=>e.loc).filter(Boolean))];
 M(`<div class="bar"><input id="q" placeholder="Search name / ID / mobile / designation" value="${esc(fq)}" oninput="fq=this.value;actRows()"><select id="fd" onchange="fd=this.value;actRows()"><option value="">All departments</option>${dp.map(d=>`<option ${d==fd?'selected':''}>${esc(d)}</option>`).join('')}</select><select id="fl" onchange="fl=this.value;actRows()"><option value="">All locations</option>${lc.map(d=>`<option ${d==fl?'selected':''}>${esc(d)}</option>`).join('')}</select><button class="btn" onclick="editId=null;go('New Employee')">+ New employee</button></div><div id="rows"></div>`);actRows()}
function actRows(){const q=fq.toLowerCase();const r=act().filter(e=>(!q||[e.name,e.eid,e.mobile,e.desig].join(' ').toLowerCase().includes(q))&&(!fd||e.dept==fd)&&(!fl||e.loc==fl));
 $('#rows').innerHTML=tbl(['ID','Name','Designation','Dept','Site','Mobile','Salary','Added by','Actions'],r.map(e=>[esc(e.eid),esc(e.name),esc(e.desig),esc(e.dept),esc(e.loc),esc(e.mobile),user.role==='Viewer'?'***':esc(e.salary),esc(e.byn||'Admin'),
 `<button class="btn s g" onclick="view('${e.id}')">View</button>${can(e)?` <button class="btn s g" onclick="editId='${e.id}';go('New Employee')">Edit</button>`:''} <button class="btn s g" onclick="quickLetter('${e.id}')">Letter</button> <button class="btn s g" onclick="idPrint('${e.id}')">ID</button> ${can(e)?`<button class="btn s r" onclick="markLeft('${e.id}')">Mark left</button> <button class="btn s r" onclick="delEmp('${e.id}')">Delete</button>`:''}`]))}
function view(id){const e=E(id);modal(`<h3>${esc(e.name)} (${esc(e.eid)})</h3>${FD.map(([k,l])=>e[k]?`<div><b>${l}:</b> ${esc(e[k])}</div>`:'').join('')}<h4>Salary / transfer / promotion history</h4>${(e.hist||[]).map(h=>h.d+' - '+esc(h.c)).join('<br>')}`)}
function delEmp(id){const e=E(id);if(!ck(e))return;if(!confirm('Delete '+e.name+' permanently? (Use "Mark left" to keep history)'))return;db.emps=db.emps.filter(x=>x.id!==id);if(FBON())FB.del(id);log('Deleted '+e.name);if(save())active()}
function markLeft(id){const e=E(id);if(!ck(e))return;modal(`<h3>Exit: ${esc(e.name)}</h3><div class="f">${[['resd','Resignation Date','date'],['lwd','Last Working Date','date'],['reason','Reason for Leaving'],['notice','Notice Period'],['exitint','Exit Interview Notes'],['ffs','Full & Final Settlement (Rs)'],['pend','Pending Salary (Rs)'],['adv','Advance Recovery (Rs)'],['unif','Uniform / ID Card Recovery'],['assets','Company Assets Returned'],['exst','Exit Status']].map(([k,l,t])=>`<div><label>${l}</label><input id="x_${k}" type="${t||'text'}" value="${esc(e[k])}"></div>`).join('')}</div><br><button class="btn" onclick="doLeft('${id}')">Move to Left Employees</button>`)}
function doLeft(id){const e=E(id);if(!ck(e))return;['resd','lwd','reason','notice','exitint','ffs','pend','adv','unif','assets','exst'].forEach(k=>e[k]=$('#x_'+k).value);e.status='Left';e.hist.push({d:today(),c:'Left company'});log('Marked left: '+e.name);if(save()){$('#modal').style.display='none';toast('Moved to Left Employees');go('Left Employees')}}
function left(){M(`<div class="bar"><input id="lq" placeholder="Search left employees" oninput="lRows()"></div><div id="rows"></div>`);lRows()}
function lRows(){const q=($('#lq').value||'').toLowerCase();$('#rows').innerHTML=tbl(['ID','Name','Designation','Dept','Site','Joined','Resigned','Last day','Reason','F&F','Exit status','Actions'],lft().filter(e=>!q||[e.name,e.eid,e.mobile].join(' ').toLowerCase().includes(q)).map(e=>[esc(e.eid),esc(e.name),esc(e.desig),esc(e.dept),esc(e.loc),esc(e.doj),esc(e.resd),esc(e.lwd),esc(e.reason),esc(e.ffs),`<span class="tag Left">${esc(e.exst||'Left')}</span>`,`<button class="btn s g" onclick="markLeft('${e.id}')">Edit exit</button> <button class="btn s g" onclick="rehire('${e.id}')">Rehire</button> <button class="btn s g" onclick="view('${e.id}')">View</button> <button class="btn s g" onclick="quickLetter('${e.id}','Relieving Letter')">Relieving</button> <button class="btn s g" onclick="quickLetter('${e.id}','Experience Letter')">Experience</button>`]))}
function attend(){M(`<div class="bar"><input type="date" id="ad" value="${today()}" onchange="attRows()"><button class="btn g" onclick="act().forEach(e=>$('#s_'+e.id).value='Present')">All present</button><button class="btn" onclick="attSave()">Save attendance</button><input type="month" id="am" value="${ym()}"><button class="btn g" onclick="attExport()">Export month (Excel)</button><button class="btn g" onclick="attPdf()">Print / PDF</button></div><div id="rows"></div>`);attRows()}
function attRows(){const d=$('#ad').value,t=db.att[d]||{};$('#rows').innerHTML=tbl(['Employee','Status','In','Out','Overtime (h)','Late','Hours'],act().map(e=>{const r=t[e.id]||{s:'Present',i:'09:00',o:'18:00',ot:0,l:'No'};return [esc(e.name),sel('s_'+e.id,['Present','Absent','Weekly Off','Paid Leave','Unpaid Leave','Half Day'],r.s),`<input type="time" id="i_${e.id}" value="${r.i}">`,`<input type="time" id="o_${e.id}" value="${r.o}">`,`<input type="number" id="t_${e.id}" value="${r.ot}" style="width:70px">`,sel('l_'+e.id,['No','Yes'],r.l),hrs(r.i,r.o,r.s)]}))}
function hrs(i,o,s){if(!i||!o||['Absent','Weekly Off','Paid Leave','Unpaid Leave'].includes(s))return 0;const[a,b]=i.split(':'),[c,d]=o.split(':');return Math.max(0,((c*60+ +d)-(a*60+ +b))/60).toFixed(1)}
function attSave(){if(ro())return;const d=$('#ad').value,old=db.att[d]||{},t={...old};let sk=0;act().forEach(e=>{const o=old[e.id];if(o&&!adm()&&o.by!==me()){sk++;return}t[e.id]={by:me(),s:$('#s_'+e.id).value,i:$('#i_'+e.id).value,o:$('#o_'+e.id).value,ot:+$('#t_'+e.id).value||0,l:$('#l_'+e.id).value}});db.att[d]=t;log('Attendance saved '+d);if(save()){toast(sk?'Saved. '+sk+' entries by others were skipped':'Attendance saved');attRows()}}

function calc(e,m){const[y,mm]=m.split('-'),dim=new Date(y,mm,0).getDate(),g=+e.salary||0;let paid=dim,has=false,ot=0;
 const ds=Object.keys(db.att).filter(d=>d.startsWith(m));if(ds.length){has=true;paid=0;ds.forEach(d=>{const r=db.att[d][e.id];if(!r)return;paid+=r.s=='Half Day'?.5:['Present','Weekly Off','Paid Leave'].includes(r.s)?1:0;ot+=r.ot||0});paid=Math.min(dim,paid)}
 const f=has?paid/dim:1,basic=Math.round(g*RU.basic/100*f),hra=Math.round(g*RU.hra/100*f),al=Math.round(g*(100-RU.basic-RU.hra)/100*f),otp=Math.round(ot*(g/dim/8)*2),gross=basic+hra+al+otp,pf=Math.round(basic*RU.pf/100),esic=g<=RU.esicLim?Math.ceil(gross*RU.esic/100):0,pt=gross>RU.ptLim?RU.pt:0;
 const x=(db.pay||{})[m+e.id]||{tds:0,adv:0,oth:0},ded=pf+esic+pt+ +x.tds+ +x.adv+ +x.oth;return{basic,hra,al,otp,gross,pf,esic,pt,tds:+x.tds,adv:+x.adv,oth:+x.oth,ded,net:gross-ded,paid,dim}}
